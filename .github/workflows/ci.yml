name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test (backend + join flow)
        run: |
          npm run start -w backend &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          SMOKE_REQUIRE_JOIN=1 npm run smoke
          kill $SERVER_PID